{{ define "main" }}
<section class="intro"><p class="eyebrow">All writing</p><h1>Archive</h1></section>
<ol class="archive-list">
{{ range where site.RegularPages "Section" "posts" }}
<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{ end }}
</ol>
{{ end }}
